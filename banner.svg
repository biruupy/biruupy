<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090d"/><stop offset="1" stop-color="#0b0f1a"/></linearGradient>
<radialGradient id="gv" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b7cff" stop-opacity=".32"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></radialGradient>
<radialGradient id="gm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7cf5c8" stop-opacity=".22"/><stop offset="1" stop-color="#7cf5c8" stop-opacity="0"/></radialGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7cf5c8"/><stop offset="1" stop-color="#8b7cff"/></linearGradient>
